<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FAFAF8;
            --bg-alt: #F2F1ED;
            --text: #1A1A1A;
            --text-muted: #5C5C5C;
            --text-light: #8A8A8A;
            --accent: #2B5C3A;
            --accent-light: #3A7A4F;
            --border: #E0DED8;
            --card-bg: #FFFFFF;
            --serif: 'Source Serif 4', Georgia, serif;
            --sans: 'DM Sans', -apple-system, sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --max-width: 820px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            font-size: 17px;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* --- NAV --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(250, 250, 248, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        nav .nav-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .nav-name {
            font-family: var(--serif);
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text);
            text-decoration: none;
        }

        nav .nav-links {
            display: flex;
            gap: 1.8rem;
            list-style: none;
        }

        nav .nav-links a {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.03em;
            transition: color 0.2s;
        }

        nav .nav-links a:hover {
            color: var(--accent);
        }

        nav .nav-links a.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 2px;
        }

        /* --- MAIN CONTENT --- */
        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 6rem 2rem 4rem;
        }

        /* --- FOOTER --- */
        footer {
            border-top: 1px solid var(--border);
            margin-top: 4rem;
            padding: 2rem;
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-light);
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--accent);
        }

        footer .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        /* --- SECTION LABELS --- */
        .section-label {
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 2rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        /* --- PAGE HERO (for interior pages) --- */
        .page-hero {
            margin-bottom: 3rem;
        }

        .page-hero h1 {
            font-family: var(--serif);
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .page-hero p {
            color: var(--text-muted);
            font-size: 1rem;
        }

    </style>
</head>
<body>

<nav>
    <div class="nav-inner">
        <a class="nav-name" href="/">Zachary Jacokes</a>
        <ul class="nav-links">
            <li><a href="/" {% if page.url == '/' %}class="active"{% endif %}>About</a></li>
            <li><a href="/research" {% if page.url contains 'research' %}class="active"{% endif %}>Research</a></li>
            <li><a href="/projects" {% if page.url contains 'projects' %}class="active"{% endif %}>Projects</a></li>
            <li><a href="/resume" {% if page.url contains 'resume' %}class="active"{% endif %}>Resume</a></li>
        </ul>
    </div>
</nav>

<main>
    {{ content }}
</main>

<footer>
    <div class="footer-links">
        <a href="mailto:zjacokes@gmail.com">Email</a>
        <a href="https://github.com/zjacokes" target="_blank" rel="noopener">GitHub</a>
        <a href="https://scholar.google.com/citations?user=zjacokes" target="_blank" rel="noopener">Google Scholar</a>
        <a href="https://www.linkedin.com/in/zjacokes" target="_blank" rel="noopener">LinkedIn</a>
    </div>
    <p>&copy; 2026 Zachary Jacokes</p>
</footer>

</body>
</html>
